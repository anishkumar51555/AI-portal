name: ai-portal

# Stateful dependencies only. `next dev` runs on the Windows host, not in a
# container — file-watching across the Windows/WSL2 bind-mount boundary is slow
# and drops changes. See docs/05-infrastructure.md section 2.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_dev_password
      POSTGRES_DB: ai_portal
      # Deterministic collation so index ordering matches production.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # If a local Postgres already owns 5432, change the HOST side to 5433
      # and update DATABASE_URL in .env.local to match.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d ai_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ai-portal-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API — the browser PUTs here directly
      - "9001:9001" # web console: http://localhost:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bootstrap. Creates the bucket, locks it private, sets the staging
  # lifecycle rule, and — critically — configures CORS so the browser can PUT
  # directly to :9000 from localhost:3000. Getting CORS wrong surfaces as an
  # opaque browser error during Phase 3, which is why it is done on day one.
  minio-init:
    image: minio/mc:latest
    container_name: ai-portal-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/minio-cors.json:/tmp/cors.json:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      for b in ai-portal ai-portal-test; do
        mc mb --ignore-existing local/$$b &&
        mc anonymous set none local/$$b &&
        mc ilm rule add --expire-days 1 --prefix 'staging/' local/$$b 2>/dev/null || true;
        mc cors set local/$$b /tmp/cors.json 2>/dev/null || true;
      done;
      echo '[minio-init] buckets ai-portal + ai-portal-test ready: private, staging expires in 1d, CORS set';
      "

volumes:
  pgdata:
  miniodata:
