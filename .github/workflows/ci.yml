name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a new push supersedes the running build

env:
  NODE_VERSION: "22"

jobs:
  # ── fast feedback: no services, so this starts instantly ──
  static:
    name: Lint · Typecheck · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run fixtures:build
      # Fails the build if any starter template stops satisfying the manifest
      # spec it is supposed to teach. Pure filesystem work — needs no services,
      # so it runs here rather than in the integration job.
      - run: npm run templates:verify
      # NO --coverage here. Most of src/server/ is covered by INTEGRATION tests
      # (rules/70: repositories and app/api are "integration only"), so measuring
      # a unit-only run against the global thresholds scores files the strategy
      # never intended unit tests to reach. The coverage gate lives in the
      # integration job, where the whole suite actually runs.
      - run: npm run test:unit

  # ── real Postgres, real MinIO. Nothing is mocked at this layer. ──
  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: ai_portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # MinIO is NOT a service container — see the "Start MinIO" step below.
    env:
      DATABASE_URL: postgresql://portal:portal@localhost:5432/ai_portal_test
      DIRECT_DATABASE_URL: postgresql://portal:portal@localhost:5432/ai_portal_test
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: ai-portal-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      AUTH_SECRET: ci-secret-that-is-at-least-32-characters-long
      AUTH_GITHUB_ID: ci
      AUTH_GITHUB_SECRET: ci
      DOWNLOAD_IP_SALT: ci-salt-0123456789abcdef
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      # MinIO runs as a plain container, not a `services:` entry, for one
      # reason: service containers cannot pass a COMMAND, and the official
      # minio image does nothing without `server /data`.
      #
      # This used to be `bitnami/minio:latest`, which starts a server by
      # default. Bitnami emptied that Docker Hub namespace in August 2025 —
      # `bitnami/minio` now has zero tags and the pull fails with "manifest
      # unknown". The surviving `bitnamilegacy/*` mirror is frozen and
      # unmaintained, so we use the image docker-compose.yml already uses and
      # accept the extra lines. CI and local now run the same MinIO.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data

          # Poll the liveness endpoint rather than `sleep`: the container is
          # usually ready in ~1s, and a fixed sleep is either slow or flaky.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO ready after ${i}s"; break
            fi
            if [ "$i" = "60" ]; then
              echo "MinIO did not become ready"; docker logs minio; exit 1
            fi
            sleep 1
          done

          # bitnami/minio created this via MINIO_DEFAULT_BUCKETS; the official
          # image has no equivalent, so create it explicitly.
          #
          # MC_HOST_<alias> configures the target from the environment. A
          # separate `mc alias set` would be pointless here — each `--rm`
          # container is a fresh filesystem, so the alias it writes is gone
          # before the next command runs.
          docker run --rm --network host \
            -e MC_HOST_ci="http://minioadmin:minioadmin@localhost:9000" \
            minio/mc:latest mb --ignore-existing ci/ai-portal-test

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      # Catches schema.prisma edited without generating a migration — the single
      # most common way a solo developer ships a build that crashes on boot.
      #
      # Prisma 7 changed this command twice over: `--to-schema-datamodel` became
      # `--to-schema`, and `--shadow-database-url` was REMOVED in favour of
      # `datasource.shadowDatabaseUrl` in prisma.config.ts. The old invocation
      # exited 1 (error), which reads exactly like "drift found" — it is not.
      #
      # The shadow database is RESET on every run, so it gets its own database
      # rather than sharing the one holding the test data.
      - name: Create shadow database
        run: |
          PGPASSWORD=portal psql -h localhost -U portal -d postgres             -c "CREATE DATABASE ai_portal_shadow;"

      - name: Migrations match schema
        env:
          SHADOW_DATABASE_URL: postgresql://portal:portal@localhost:5432/ai_portal_shadow
        run: |
          npx prisma migrate diff             --from-migrations prisma/migrations             --to-schema prisma/schema.prisma             --exit-code

      # The coverage gate lives HERE, over the whole suite, because this is the
      # only job with a real Postgres and MinIO. The thresholds in
      # vitest.config.ts are unchanged — they simply now measure the population
      # docs/11 §1 describes, instead of scoring integration-only code against a
      # unit-only run and reporting 0%.
      - run: npm run test -- --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      # E2E runs in THIS job because it is the only one with Postgres and MinIO.
      # The session cookie is forged with the real secret against a real user
      # row, so every guard runs as in production — only GitHub's OAuth screen
      # is skipped (docs/11 §4).
      - run: npx playwright install --with-deps chromium
      - run: npm run templates:build
      - run: npm run db:seed
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: MinIO logs on failure
        if: failure()
        run: docker logs minio

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [static]
    env:
      # Placeholders: `next build` evaluates modules, and src/lib/env.ts refuses
      # to load without a valid configuration. These never reach a running app.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      AUTH_SECRET: build-time-placeholder-secret-32-chars-long
      AUTH_GITHUB_ID: placeholder
      AUTH_GITHUB_SECRET: placeholder
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: placeholder
      S3_ACCESS_KEY_ID: placeholder
      S3_SECRET_ACCESS_KEY: placeholder
      DOWNLOAD_IP_SALT: placeholder-salt-0123456789
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  # ── every critical feature in a completed phase must have a test ──
  feature-gate:
    name: Feature coverage
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # One --gate line per COMPLETED phase. A gate on an unbuilt phase would
      # block every PR from day one, so they are added as each phase lands.
      # P5 is deliberately absent: its features are deploy-time and manual.
      - run: npm run test:matrix -- --gate P0
      - run: npm run test:matrix -- --gate P1
      - run: npm run test:matrix -- --gate P2
      - run: npm run test:matrix -- --gate P3
      - run: npm run test:matrix -- --gate P4
      - name: Full matrix (informational)
        run: npm run test:matrix
        continue-on-error: true

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

      # Scans the IMAGE, not the repo: CodeQL and `npm audit` see application
      # code and npm dependencies, neither of which covers the Alpine base
      # layer's OS packages. That is where a surprising share of CVEs live.
      - name: Build image for scanning
        run: docker build -t ai-portal:scan .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        # The scan is INFORMATIONAL. Trivy pulls its vulnerability database from
        # ghcr.io on every run, and that pull is rate-limited — so the scanner
        # being unavailable must not fail a build that has nothing wrong with it.
        continue-on-error: true
        env:
          # Authenticates the DB pull, which is what the rate limit applies to.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ai-portal:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          # Report rather than block: a base-image CVE with no fix available
          # would otherwise wedge every merge until upstream ships a patch.
          exit-code: "0"

      # Only when the scan actually produced a file. `if: always()` alone made
      # a failed scan fail the JOB at the upload step instead — "Path does not
      # exist: trivy.sarif", which says nothing about the real cause.
      - name: Upload Trivy results
        if: hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
